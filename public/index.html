<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Future Technologists of the Philippines</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-image: url('/ftplogo.png');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: 380px;
      background-color: rgba(250, 235, 255, 0.9);
      background-blend-mode: overlay;
    }
    .header-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header-logo { height: 60px; width: auto; }
    h2 { font-size: 36px; font-weight: 900; margin: 0; color: #2d0b3f; }
    
    .nav-group { display: flex; gap: 10px; align-items: center; }
    .nav-link { padding: 10px 18px; background-color: #3f1a5b; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
    .nav-link:hover { background-color: #57257e; }
    
    .admin-btn {display: flex; gap: 10px; align-tems: center; }
    .admin-btn { padding: 10px 18px; background-color: #3f1a5b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .admin-btn.active { background-color: #3f1a5b; }

    /* Hidden by default for non-admins */
    .admin-only { display: none; }

    form { background: rgba(255, 255, 255, 0.85); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; }
    input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
    button[type="submit"] { background-color: #3f1a5b; color: white; padding: 8px 16px; }
    
    table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.95); border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #34495e; color: white; }
    
    .badge-available { background: #2ecc71; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .badge-unavailable { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .status-btn { padding: 5px 10px; background: #e0e0e0; border: 1px solid #ccc; }
    .delete-btn { padding: 5px 10px; background: #e74c3c; color: white; }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="header-left">
      <img src="/ftplogo.png" alt="FTP Logo" class="header-logo">
      <h2>FTP Master Inventory</h2>
    </div>
    <div class="nav-group">
      <button id="adminToggleBtn" class="admin-btn" onclick="toggleAdminMode()">Admin Login</button>
      <a href="/logbook.html" class="nav-link">Borrowing Logbook →</a>
    </div>
  </div>

  <!-- Add Item Form (Admin Only) -->
  <form id="productForm" class="admin-only">
    <input type="text" id="sku" placeholder="Item ID" required>
    <input type="text" id="name" placeholder="Item Name" required>
    <button type="submit">Add New Item</button>
  </form>

  <!-- Master Inventory Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Item ID</th>
        <th>Item Name</th>
        <th>Live Status</th>
        <th class="admin-only">Actions</th>
      </tr>
    </thead>
    <tbody id="inventoryTable"></tbody>
  </table>

  <script>
    // Configuration
    const ADMIN_PIN = "FTP2026"; // Set your preferred Admin password/PIN here
    let isAdmin = false;

    function toggleAdminMode() {
      if (!isAdmin) {
        const inputPin = prompt("Enter Admin PIN to unlock management features:");
        if (inputPin === ADMIN_PIN) {
          isAdmin = true;
          document.getElementById('adminToggleBtn').innerText = "Admin Mode: Active";
          document.getElementById('adminToggleBtn').classList.add('active');
          alert("Admin mode unlocked!");
        } else if (inputPin !== null) {
          alert("Incorrect PIN.");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminToggleBtn').innerText = "Admin Login";
        document.getElementById('adminToggleBtn').classList.remove('active');
        alert("Logged out of Admin mode.");
      }
      updateUI();
    }

    function updateUI() {
      const adminElements = document.querySelectorAll('.admin-only');
      adminElements.forEach(el => {
        el.style.display = isAdmin ? (el.tagName === 'FORM' ? 'flex' : 'table-cell') : 'none';
      });
      fetchProducts();
    }

    async function fetchProducts() {
      const res = await fetch('/api/products');
      const data = await res.json();
      const tbody = document.getElementById('inventoryTable');
      tbody.innerHTML = '';
      
      data.forEach(item => {
        const isAvailable = item.status === 'Available';
        const badgeClass = isAvailable ? 'badge-available' : 'badge-unavailable';
        
        tbody.innerHTML += `
          <tr>
            <td>${item.id}</td>
            <td>${item.sku}</td>
            <td>${item.name}</td>
            <td><span class="${badgeClass}">${item.status}</span></td>
            <td class="admin-only" style="display: ${isAdmin ? 'table-cell' : 'none'};">
              <button class="status-btn" onclick="toggleStatus(${item.id}, '${isAvailable ? 'Not Available' : 'Available'}')">
                Mark as ${isAvailable ? 'Not Available' : 'Available'}
              </button>
              <button class="delete-btn" onclick="deleteProduct(${item.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!isAdmin) return alert("Unauthorized!");

      const payload = {
        sku: document.getElementById('sku').value,
        name: document.getElementById('name').value
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) alert("Error: Item ID must be unique");
      else {
        e.target.reset();
        fetchProducts();
      }
    });

    async function toggleStatus(id, newStatus) {
      if (!isAdmin) return alert("Unauthorized!");
      await fetch(`/api/products/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      fetchProducts();
    }

    async function deleteProduct(id) {
      if (!isAdmin) return alert("Unauthorized!");
      if (!confirm("Are you sure you want to delete this item?")) return;
      await fetch(`/api/products/${id}`, { method: 'DELETE' });
      fetchProducts();
    }

    fetchProducts();
  </script>
</body>
</html>

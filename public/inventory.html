<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master Inventory - FTP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #faebff; }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #34495e; color: white; }
    .badge-available { background: #2ecc71; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .badge-borrowed { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .nav-btn { padding: 8px 16px; background: #3f1a5b; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
<!-- Inside the top header container of public/inventory.html -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
  <h2>FTP Master Inventory List</h2>
  
  <!-- Add this link to return to the logbook -->
  <a href="/" class="nav-btn">← Back to Logbook</a>
</div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Item ID (SKU)</th>
        <th>Item Name</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="masterTable"></tbody>
  </table>

  <script>
    async function fetchMasterList() {
      const res = await fetch('/api/products');
      const data = await res.json();
      const tbody = document.getElementById('masterTable');
      tbody.innerHTML = '';

      data.forEach(item => {
        const isBorrowed = item.status === 'Borrowed';
        const badgeClass = isBorrowed ? 'badge-borrowed' : 'badge-available';
        
        tbody.innerHTML += `
          <tr>
            <td>${item.id}</td>
            <td>${item.sku}</td>
            <td>${item.name}</td>
            <td><span class="${badgeClass}">${item.status || 'Available'}</span></td>
            <td>
              <button onclick="toggleStatus(${item.id}, '${isBorrowed ? 'Available' : 'Borrowed'}')">
                Mark as ${isBorrowed ? 'Available' : 'Borrowed'}
              </button>
            </td>
          </tr>
        `;
      });
    }

    async function toggleStatus(id, newStatus) {
      await fetch(`/api/products/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      fetchMasterList();
    }

    fetchMasterList();
  </script>
</body>
</html>
